name: Refresh source index

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-source-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install workbook dependency
        run: python -m pip install openpyxl
      - name: Discover recent sources
        run: python scripts/update_sources.py
      - name: Commit updated index
        run: |
          if git diff --quiet -- data/latest.json data/archive.json data/archive-metadata.csv downloads/rasuwa-flood-source-metadata.xlsx; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/archive.json data/archive-metadata.csv downloads/rasuwa-flood-source-metadata.xlsx
          git commit -m "Update automated source index"
          git push
